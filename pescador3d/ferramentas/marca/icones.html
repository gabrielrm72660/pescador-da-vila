<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Caveat; src: url(CaveatBrush-Regular.ttf); }
@font-face { font-family: Patrick; src: url(PatrickHand-Regular.ttf); }
body { margin: 0; background: #e9e2d2; font-family: Patrick, sans-serif; }
.folha { width: 1800px; padding: 50px 40px 40px; box-sizing: border-box; display: flex; justify-content: space-around; }
.op { width: 520px; text-align: center; }
.op svg { width: 420px; height: 420px; filter: drop-shadow(0 14px 18px rgba(30,30,40,.35)); }
.nome { font-family: Caveat; font-size: 86px; color: #1f3440; margin: 18px 0 0; line-height: 1; }
.sub { font-size: 27px; color: #4d5b60; margin-top: 10px; line-height: 1.25; }
.num { font-family: Caveat; font-size: 40px; color: #b0452d; }
.unico svg { width: 512px; height: 512px; filter: none; }
</style></head>
<body>
<div class="folha" id="folha">

<!-- 1. BRUMA -->
<div class="op"><div class="num">1</div>
<svg id="i1" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <clipPath id="c1"><rect width="512" height="512" rx="104"/></clipPath>
  <linearGradient id="ceu1" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#16293a"/><stop offset=".55" stop-color="#3d5f6b"/><stop offset="1" stop-color="#7d9a98"/>
  </linearGradient>
  <linearGradient id="mar1" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#2c4a55"/><stop offset="1" stop-color="#0e1f29"/>
  </linearGradient>
  <linearGradient id="feixe1" x1="1" y1="0" x2="0" y2="0">
   <stop offset="0" stop-color="#fff4cf" stop-opacity=".95"/><stop offset="1" stop-color="#fff4cf" stop-opacity="0"/>
  </linearGradient>
  <filter id="borra1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="borra1b" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  <radialGradient id="lanterna1"><stop offset="0" stop-color="#fffbe6"/><stop offset=".25" stop-color="#ffe9a8" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
 </defs>
 <g clip-path="url(#c1)">
  <rect width="512" height="512" fill="url(#ceu1)"/>
  <!-- estrelas fracas -->
  <g fill="#e8f1f0" opacity=".55"><circle cx="70" cy="60" r="2"/><circle cx="160" cy="38" r="1.5"/><circle cx="300" cy="70" r="1.8"/><circle cx="220" cy="110" r="1.2"/><circle cx="110" cy="130" r="1.4"/></g>
  <!-- feixe do farol -->
  <polygon points="392,170 -20,120 -20,250" fill="url(#feixe1)" opacity=".75"/>
  <!-- penhasco -->
  <path d="M330 330 C350 280 372 262 405 255 L470 250 C500 255 520 270 530 290 L530 380 L330 380 Z" fill="#1b2b30"/>
  <path d="M355 300 C372 276 392 266 420 262 L450 262 C430 270 405 282 380 306 Z" fill="#2f4545" opacity=".8"/>
  <!-- farol -->
  <g>
   <polygon points="378,262 406,262 400,168 384,168" fill="#ece6d8"/>
   <polygon points="381.6,234 402.4,234 401.3,214 382.7,214" fill="#b7432f"/>
   <polygon points="383.3,198 400.7,198 400,180 384,180" fill="#b7432f"/>
   <rect x="380" y="160" width="24" height="10" rx="2" fill="#2a3338"/>
   <rect x="384" y="144" width="16" height="16" rx="2" fill="#ffe7a3"/>
   <path d="M381 145 L392 132 L403 145 Z" fill="#2a3338"/>
   <circle cx="392" cy="152" r="46" fill="url(#lanterna1)"/>
  </g>
  <!-- mar -->
  <rect y="340" width="512" height="180" fill="url(#mar1)"/>
  <g stroke="#9cb8b4" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" fill="none">
   <path d="M30 380 q30 -6 60 0"/><path d="M160 402 q35 -7 70 0"/><path d="M300 430 q30 -6 60 0"/><path d="M80 452 q40 -8 80 0"/><path d="M380 470 q30 -6 60 0"/>
  </g>
  <!-- barquinho com luz -->
  <g transform="translate(118 330)">
   <path d="M0 18 L84 18 L72 34 L10 34 Z" fill="#101a20"/>
   <rect x="22" y="2" width="26" height="16" fill="#101a20"/>
   <rect x="54" y="-30" width="3" height="48" fill="#101a20"/>
   <circle cx="35" cy="10" r="3.4" fill="#ffd98a"/>
   <circle cx="35" cy="10" r="16" fill="#ffd98a" opacity=".25" filter="url(#borra1b)"/>
  </g>
  <!-- bruma -->
  <g fill="#dfe9e6" filter="url(#borra1)">
   <ellipse cx="90" cy="340" rx="170" ry="26" opacity=".55"/>
   <ellipse cx="330" cy="366" rx="210" ry="30" opacity=".5"/>
   <ellipse cx="220" cy="300" rx="160" ry="18" opacity=".35"/>
   <ellipse cx="420" cy="320" rx="120" ry="16" opacity=".35"/>
   <ellipse cx="150" cy="430" rx="220" ry="34" opacity=".28"/>
  </g>
 </g>
</svg>
<div class="nome">Bruma</div>
<div class="sub">A névoa que sobe à noite e o farol que abre caminho nela.</div>
</div>

<!-- 2. MARÉ FUNDA -->
<div class="op"><div class="num">2</div>
<svg id="i2" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <clipPath id="c2"><rect width="512" height="512" rx="104"/></clipPath>
  <linearGradient id="ceu2" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#e98e5a"/><stop offset=".7" stop-color="#f6c78a"/><stop offset="1" stop-color="#f9dca6"/>
  </linearGradient>
  <linearGradient id="fundo2" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#2b7d86"/><stop offset=".35" stop-color="#16465a"/><stop offset=".75" stop-color="#0a1c2b"/><stop offset="1" stop-color="#040b13"/>
  </linearGradient>
  <radialGradient id="olho2"><stop offset="0" stop-color="#f4f0b8"/><stop offset=".35" stop-color="#d9d27a" stop-opacity=".8"/><stop offset="1" stop-color="#d9d27a" stop-opacity="0"/></radialGradient>
  <radialGradient id="sol2"><stop offset="0" stop-color="#fff6df"/><stop offset=".5" stop-color="#ffe0a3"/><stop offset="1" stop-color="#ffd08a" stop-opacity="0"/></radialGradient>
  <filter id="borra2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
 </defs>
 <g clip-path="url(#c2)">
  <rect width="512" height="512" fill="url(#ceu2)"/>
  <circle cx="370" cy="150" r="78" fill="url(#sol2)"/>
  <circle cx="370" cy="150" r="34" fill="#fff3d6"/>
  <rect y="182" width="512" height="340" fill="url(#fundo2)"/>
  <!-- linha d'água -->
  <path d="M0 182 q32 -6 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 V196 H0 Z" fill="#3f99a0"/>
  <!-- raios de luz na água -->
  <g fill="#bfe8e2" opacity=".12"><polygon points="120,190 160,190 120,420 70,420"/><polygon points="250,190 285,190 300,460 250,460"/><polygon points="380,190 410,190 460,400 420,400"/></g>
  <!-- barco -->
  <g transform="translate(176 140)">
   <path d="M0 34 L130 34 L114 56 L14 56 Z" fill="#20313a"/>
   <path d="M6 34 L124 34" stroke="#d8c7a6" stroke-width="4"/>
   <rect x="30" y="12" width="40" height="22" fill="#20313a"/>
   <rect x="36" y="17" width="10" height="8" fill="#f3c27c"/>
   <rect x="86" y="-34" width="4" height="68" fill="#20313a"/>
   <line x1="88" y1="-30" x2="128" y2="24" stroke="#20313a" stroke-width="2"/>
  </g>
  <!-- linha de pesca descendo -->
  <path d="M302 166 C300 260 296 330 286 386" stroke="#e7eee9" stroke-width="2" fill="none" opacity=".85"/>
  <path d="M286 386 q-2 14 -12 14 q-9 0 -9 -9" stroke="#e7eee9" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- o que mora embaixo: só dois olhos -->
  <g>
   <ellipse cx="196" cy="462" rx="30" ry="12" fill="url(#olho2)"/>
   <ellipse cx="318" cy="462" rx="30" ry="12" fill="url(#olho2)"/>
   <ellipse cx="196" cy="462" rx="7" ry="5" fill="#fbf8d8"/>
   <ellipse cx="318" cy="462" rx="7" ry="5" fill="#fbf8d8"/>
  </g>
  <g fill="#cfeee6" opacity=".5" filter="url(#borra2)"><circle cx="270" cy="300" r="3"/><circle cx="262" cy="330" r="2"/><circle cx="276" cy="355" r="2.5"/></g>
 </g>
</svg>
<div class="nome">Maré Funda</div>
<div class="sub">A vida tranquila na superfície; embaixo, o fundo que ninguém conhece.</div>
</div>

<!-- 3. ESTRELA D'ALVA -->
<div class="op"><div class="num">3</div>
<svg id="i3" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <clipPath id="c3"><rect width="512" height="512" rx="104"/></clipPath>
  <linearGradient id="ceu3" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#1b2850"/><stop offset=".45" stop-color="#4f5c8a"/><stop offset=".78" stop-color="#d99b8a"/><stop offset="1" stop-color="#f4c98f"/>
  </linearGradient>
  <linearGradient id="mar3" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#5a6c8c"/><stop offset="1" stop-color="#1a2440"/>
  </linearGradient>
  <radialGradient id="brilho3"><stop offset="0" stop-color="#ffffff"/><stop offset=".2" stop-color="#fff4d8" stop-opacity=".9"/><stop offset="1" stop-color="#ffe7b0" stop-opacity="0"/></radialGradient>
  <linearGradient id="reflexo3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1cf" stop-opacity=".8"/><stop offset="1" stop-color="#fff1cf" stop-opacity="0"/></linearGradient>
 </defs>
 <g clip-path="url(#c3)">
  <rect width="512" height="512" fill="url(#ceu3)"/>
  <g fill="#e9ecff" opacity=".7"><circle cx="60" cy="70" r="1.8"/><circle cx="130" cy="40" r="1.3"/><circle cx="200" cy="95" r="1.6"/><circle cx="90" cy="150" r="1.2"/><circle cx="450" cy="60" r="1.5"/><circle cx="260" cy="40" r="1.1"/></g>
  <!-- estrela d'alva -->
  <circle cx="352" cy="132" r="92" fill="url(#brilho3)"/>
  <path d="M352 62 L362 122 L422 132 L362 142 L352 202 L342 142 L282 132 L342 122 Z" fill="#fffaf0"/>
  <!-- ilha com coqueiros à esquerda -->
  <path d="M-10 318 C30 292 80 286 120 300 C150 310 170 318 186 326 L-10 326 Z" fill="#2a2d45"/>
  <g stroke="#2a2d45" stroke-width="5" fill="none" stroke-linecap="round">
   <path d="M62 300 C60 270 66 250 78 236"/><path d="M100 304 C100 282 104 268 112 258"/>
  </g>
  <g fill="#2a2d45">
   <path d="M78 236 c-24 -6 -40 4 -48 14 c18 -8 34 -8 48 -14 Z"/><path d="M78 236 c18 -16 38 -16 50 -8 c-18 0 -34 4 -50 8 Z"/><path d="M78 236 c-6 -20 -2 -32 6 -38 c-2 14 -4 26 -6 38 Z"/>
   <path d="M112 258 c-18 -4 -30 3 -36 10 c14 -6 26 -6 36 -10 Z"/><path d="M112 258 c14 -12 28 -12 38 -6 c-14 0 -26 3 -38 6 Z"/>
  </g>
  <!-- mar -->
  <rect y="324" width="512" height="200" fill="url(#mar3)"/>
  <rect x="336" y="324" width="32" height="190" fill="url(#reflexo3)"/>
  <g stroke="#f7d9b0" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"><line x1="322" y1="350" x2="384" y2="350"/><line x1="330" y1="374" x2="376" y2="374"/><line x1="338" y1="400" x2="368" y2="400"/></g>
  <!-- barco de pesca -->
  <g transform="translate(150 266)">
   <path d="M0 52 L168 52 C160 64 150 74 136 78 L26 78 C14 72 6 62 0 52 Z" fill="#141b30"/>
   <rect x="96" y="22" width="44" height="30" fill="#141b30"/>
   <rect x="104" y="29" width="11" height="9" fill="#f3c27c"/>
   <rect x="120" y="29" width="11" height="9" fill="#f3c27c" opacity=".7"/>
   <rect x="60" y="-48" width="4" height="100" fill="#141b30"/>
   <line x1="62" y1="-44" x2="8" y2="50" stroke="#141b30" stroke-width="2"/>
   <line x1="62" y1="-44" x2="150" y2="22" stroke="#141b30" stroke-width="2"/>
  </g>
  <g stroke="#cfd6f0" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"><path d="M40 420 q30 -6 60 0"/><path d="M160 452 q35 -7 70 0"/><path d="M410 440 q30 -6 60 0"/></g>
 </g>
</svg>
<div class="nome">Estrela d'Alva</div>
<div class="sub">O nome do seu barco: a estrela que o pescador vê ao sair antes do sol.</div>
</div>

</div>
</body></html>
