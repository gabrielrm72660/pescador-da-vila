# Gera o APK de Android do Bruma (pasta pescador3d/), o Bruma.exe de Windows e, desde a v0.9.2, o instalador do Windows
# (Bruma_Setup_vX.exe, feito com o Inno Setup a partir de pescador3d/instalador/bruma.iss).
# Roda sozinho a cada push na branch pescador-3d que mexa no jogo, ou pela aba Actions > "Bruma: Android e Windows" > Run workflow.
# O APK sai assinado com uma chave de depuração gerada na hora: serve para instalar no celular (permitir "fontes desconhecidas"),
# não para publicar na Play Store.
name: "Bruma: Android e Windows"

on:
  workflow_dispatch:
  push:
    branches: [pescador-3d]
    paths: ["pescador3d/**", ".github/workflows/bruma-android.yml"]

jobs:
  exportar:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSAO: "4.7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK do Android (o runner já traz um; só confere build-tools e plataforma)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          ls "$ANDROID_HOME/build-tools"

      - name: Godot e modelos de exportação
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSAO}-stable"
          wget -q "$base/Godot_v${GODOT_VERSAO}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSAO}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSAO}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSAO}-stable_linux.x86_64" godot
          chmod +x godot
          destino="$HOME/.local/share/godot/export_templates/${GODOT_VERSAO}.stable"
          mkdir -p "$destino"
          unzip -q "Godot_v${GODOT_VERSAO}-stable_export_templates.tpz"
          mv templates/* "$destino/"
          ls "$destino"

      - name: Chave de depuração e configurações do editor
        run: |
          set -e
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres "editor_settings-${GODOT_VERSAO}.tres"; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > "$HOME/.config/godot/$f"
          done
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Importar o projeto
        working-directory: pescador3d
        run: timeout 1200 ../godot --headless --path . --import || true

      - name: Exportar APK (Android) e EXE (Windows)
        working-directory: pescador3d
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ../godot --headless --path . --export-debug "Android" build/Bruma.apk
          ../godot --headless --path . --export-release "Windows Desktop" build/Bruma.exe
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: Bruma-Android
          path: pescador3d/build/Bruma.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Bruma-Windows
          path: pescador3d/build/Bruma.exe
          if-no-files-found: warn

  # v0.9.2: instalador do Windows (Inno Setup). Usa o Bruma.exe exportado acima.
  instalador:
    needs: exportar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pescador3d/instalador
            pescador3d/project.godot

      - uses: actions/download-artifact@v4
        with:
          name: Bruma-Windows
          path: pescador3d/build

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe não encontrado" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Gerar o instalador
        shell: pwsh
        working-directory: pescador3d/instalador
        run: |
          $linha = Select-String -Path ..\project.godot -Pattern '^config/version="(.+)"' | Select-Object -First 1
          $versao = $linha.Matches[0].Groups[1].Value
          Write-Host "Versão $versao"
          & $env:ISCC "/DVersao=$versao" "/DOrigem=..\build" bruma.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }
          Get-ChildItem saida

      - uses: actions/upload-artifact@v4
        with:
          name: Bruma-Instalador
          path: pescador3d/instalador/saida/*.exe
          if-no-files-found: error
